<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<script src="sdpi-components.js"></script>
		<style>
			.hint {
				margin: 4px 0 0 102px;
				color: #969696;
				font-size: 9pt;
			}
		</style>
	</head>
	<body>
		<sdpi-item label="Model">
			<sdpi-select
				setting="modelId"
				datasource="getModels"
				hot-reload
				show-refresh
				loading="Loading models…"
				placeholder="Choose a downloaded model"
			></sdpi-select>
		</sdpi-item>
		<sdpi-item label="Title">
			<sdpi-checkbox setting="hideName" label="Hide model name"></sdpi-checkbox>
		</sdpi-item>
		<p class="hint">Only models downloaded in Handy are listed. Switching restarts Handy, which takes a few seconds.</p>
	</body>
</html>
